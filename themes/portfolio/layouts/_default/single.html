{{ define "main" }}
<section class="page-header">
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p>{{ . }}</p>{{ end }}
</section>
<section class="section">
  <div class="container" style="max-width: 800px;">
    <article style="color: var(--text-light); line-height: 1.8;">
      {{ .Content }}
    </article>
    <div style="margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--border);">
      {{ with .CurrentSection }}
        {{ if ne .RelPermalink "/" }}
        <a href="{{ .RelPermalink }}" class="btn btn-secondary">← Back to {{ .Title }}</a>
        {{ else }}
        <a href="{{ "/" | relURL }}" class="btn btn-secondary">← Back to Home</a>
        {{ end }}
      {{ else }}
      <a href="{{ "/" | relURL }}" class="btn btn-secondary">← Back to Home</a>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
