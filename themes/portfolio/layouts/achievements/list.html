{{ define "main" }}
<section class="page-header">
  <h1>Achievements</h1>
  <p>Professional accomplishments and career milestones</p>
</section>

<section class="section">
  <div class="container">
    <div class="timeline">
      {{ range .Pages.ByDate.Reverse }}
      <div class="timeline-item">
        <div class="timeline-dot"></div>
        <div class="timeline-content">
          <h3>{{ .Title }}</h3>
          <p class="date">{{ .Params.cert_date }}</p>
          <p>{{ .Params.description }}</p>
          {{ with .Params.image }}
          <img src="{{ . | relURL }}" alt="{{ $.Title }}" class="training-image">
          {{ end }}
        </div>
      </div>
      {{ end }}
    </div>
  </div>
</section>
{{ end }}
